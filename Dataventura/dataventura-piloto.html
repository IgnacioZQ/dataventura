<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a13">
  <title>DataMind — Gimnasio de Pensamiento Analítico</title>
  <style>
    :root {
      --ink: #172c4d; --muted: #65758b; --blue: #2457c5; --blue-dark: #193f99;
      --blue-soft: #eaf0ff; --green: #14865d; --green-soft: #e4f5ed;
      --amber: #a7650b; --amber-soft: #fff3d8; --red: #b94d51; --red-soft: #ffeded;
      --paper: #fff; --bg: #f4f7fb; --line: #e3eaf3; --shadow: 0 14px 36px #1d345412;
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    [hidden] { display:none !important; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.5; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #6b93ff; outline-offset: 3px; }
    .shell { max-width: 1160px; margin: auto; padding: 0 26px 38px; }
    .topbar { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font-weight: 850; letter-spacing: -.04em; font-size: 21px; }
    .brand-mark { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 13px; color: white; background: linear-gradient(145deg, #3776ed, #183e9b); box-shadow: 0 6px 15px #2457c533; }
    .brand-mark svg { width: 23px; height: 23px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 99px; background: white; color: var(--muted); font-size: 13px; font-weight: 750; border: 1px solid var(--line); }
    .pill.premium { color: #80530c; background: #fff2d2; border-color: #f4dda8; }
    main { min-height: calc(100vh - 145px); }
    .view { animation: rise .28s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .eyebrow { color: var(--blue); font-weight: 800; font-size: 12px; letter-spacing: .11em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 12px; font-size: clamp(31px, 5vw, 48px); line-height: 1.08; letter-spacing: -.045em; }
    h2 { font-size: 24px; letter-spacing: -.03em; margin-bottom: 8px; }
    h3 { font-size: 17px; margin-bottom: 7px; }
    .subtle { color: var(--muted); }
    .btn { display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-height: 48px; border: 0; border-radius: 13px; padding: 12px 19px; font-weight: 800; transition: transform .15s, box-shadow .15s, background .15s; }
    .btn:hover:not(:disabled) { transform: translateY(-2px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn-primary { color: white; background: var(--blue); box-shadow: 0 7px 15px #2457c52e; }
    .btn-primary:hover { background: var(--blue-dark); box-shadow: 0 9px 20px #2457c53d; }
    .btn-secondary { color: var(--blue); background: var(--blue-soft); }
    .btn-plain { color: var(--muted); background: transparent; }
    .btn[disabled] { cursor: not-allowed; opacity: .48; }
    .onboarding { max-width: 770px; margin: 42px auto; padding: clamp(25px, 6vw, 54px); }
    .welcome-icon { display: grid; place-items: center; width: 67px; height: 67px; margin-bottom: 25px; border-radius: 22px; background: var(--blue-soft); color: var(--blue); }
    .welcome-icon svg { width: 38px; }
    .value-prop { max-width: 570px; font-size: 17px; color: var(--muted); margin-bottom: 28px; }
    .field { margin: 22px 0; }
    .field label, .field legend { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 800; }
    .field input { width: 100%; max-width: 410px; padding: 13px 15px; background: #fbfcfe; border: 1px solid #d6e0ec; border-radius: 11px; color: var(--ink); }
    fieldset { border: 0; padding: 0; margin: 22px 0; }
    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .choice { position: relative; }
    .choice input { position: absolute; opacity: 0; }
    .choice span { display: block; height: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fbfcfe; color: #344761; font-size: 14px; font-weight: 650; transition: .15s; }
    .choice input:checked + span { color: var(--blue-dark); border-color: var(--blue); background: var(--blue-soft); box-shadow: inset 0 0 0 1px var(--blue); }
    .choice input:focus-visible + span { outline: 3px solid #6b93ff; outline-offset: 2px; }
    .onboarding-error { color: var(--red); font-size: 13px; min-height: 20px; margin: 2px 0 8px; }
    .dashboard-hero { position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 34px 36px; margin: 12px 0 22px; color: white; background: linear-gradient(115deg, #183f9a, #2861cb 68%, #4384e3); border-radius: 24px; box-shadow: 0 18px 35px #163d8c29; }
    .dashboard-hero:after { content: ""; position: absolute; right: 8%; top: -90px; width: 280px; height: 280px; border: 1px solid #ffffff26; border-radius: 50%; box-shadow: 0 0 0 35px #ffffff0b, 0 0 0 70px #ffffff08; }
    .hero-content { position: relative; z-index: 1; max-width: 620px; }
    .hero-content .eyebrow { color: #c8d9ff; }
    .hero-content p { color: #e1eaff; margin-bottom: 20px; }
    .hero-content h1 { font-size: clamp(29px, 4vw, 40px); }
    .hero-cta { position: relative; z-index: 1; flex-shrink: 0; color: var(--blue-dark); background: white; box-shadow: 0 8px 22px #102f6b3b; }
    .hero-cta:hover { background: #f0f5ff; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 13px; margin-bottom: 23px; }
    .stat { padding: 18px 19px; }
    .stat .stat-top { display: flex; justify-content: space-between; gap: 7px; align-items: center; color: var(--muted); font-size: 12px; font-weight: 750; }
    .stat-icon { font-size: 18px; }
    .stat strong { display: block; font-size: 26px; letter-spacing: -.04em; margin: 5px 0 2px; }
    .stat small { color: var(--muted); font-size: 12px; }
    .progress-track { height: 7px; background: #e9eef6; border-radius: 9px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #3475e7, #3aab80); transition: width .4s ease; }
    .dash-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(265px, .9fr); gap: 20px; align-items: start; }
    .route-card { padding: 25px; }
    .section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .route-progress { width: 160px; flex-shrink: 0; }
    .route-progress span { display: block; text-align: right; color: var(--muted); font-size: 12px; margin-bottom: 7px; }
    .module-list { display: grid; gap: 10px; }
    .module { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; padding: 13px; border: 1px solid var(--line); border-radius: 14px; }
    .module-symbol { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: var(--blue); background: var(--blue-soft); font-weight: 850; }
    .module.locked { opacity: .62; background: #fafbfd; }
    .module.locked .module-symbol { color: #7d8a9b; background: #edf0f4; }
    .module-meta { color: var(--muted); font-size: 12px; }
    .module-title { font-size: 14px; font-weight: 800; margin-bottom: 3px; }
    .module-percent { color: var(--muted); font-size: 12px; font-weight: 750; }
    .badges-card { padding: 23px; margin-bottom: 17px; }
    .badges { display: flex; flex-wrap: wrap; gap: 9px; }
    .badge { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #f0dfb7; background: #fff8e8; color: #7d570e; border-radius: 99px; padding: 8px 10px; font-size: 12px; font-weight: 750; }
    .badge-locked { filter: grayscale(1); opacity: .42; background: #f5f6f8; border-color: #e5e8ed; color: #68768a; }
    .premium-card { padding: 21px; background: linear-gradient(145deg, #fff9ea, #fff); border-color: #f1e1bd; }
    .premium-card p { color: #6d624d; font-size: 13px; margin: 8px 0 14px; }
    .text-button { padding: 0; border: 0; background: transparent; color: var(--blue); font-weight: 800; }
    .session-wrap { max-width: 820px; margin: 28px auto; }
    .session-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 17px; }
    .session-head .progress-track { flex: 1; max-width: 400px; }
    .session-card { padding: clamp(22px, 5vw, 38px); }
    .question-meta { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    .tag { padding: 5px 9px; border-radius: 99px; background: var(--blue-soft); color: var(--blue-dark); font-size: 11px; font-weight: 800; }
    .tag.level { color: #78520f; background: var(--amber-soft); }
    .question { font-size: clamp(22px, 3.3vw, 29px); line-height: 1.25; letter-spacing: -.03em; margin-bottom: 11px; }
    .context { color: var(--muted); margin-bottom: 19px; }
    .data-box { padding: 15px; margin: 16px 0 20px; background: #f7f9fc; border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
    .data-box table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    .data-box th, .data-box td { padding: 8px 10px; border-bottom: 1px solid #e6ebf2; white-space: nowrap; }
    .data-box th { color: #52657f; font-weight: 800; }
    .data-box tr:last-child td { border-bottom: 0; }
    .data-caption { font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 7px; }
    .options { display: grid; gap: 10px; margin: 21px 0; }
    .option { width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 14px 15px; border: 1px solid #dfe6ef; border-radius: 13px; background: white; color: #2d405b; text-align: left; transition: .15s; }
    .option:hover:not(:disabled) { border-color: #86a7f2; background: #f8faff; transform: translateY(-1px); }
    .option-letter { flex: 0 0 25px; display: grid; place-items: center; height: 25px; border-radius: 8px; background: #eff3f8; color: #61728a; font-size: 12px; font-weight: 850; }
    .option.selected { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); background: var(--blue-soft); }
    .option.correct { border-color: #72c49e; background: var(--green-soft); color: #155c41; }
    .option.incorrect { border-color: #e9a2a2; background: var(--red-soft); color: #82383b; }
    .option:disabled { cursor: default; }
    .hint { display: none; color: #775814; background: var(--amber-soft); border-radius: 11px; padding: 11px 13px; font-size: 13px; margin: 12px 0; }
    .hint.visible { display: block; animation: rise .2s ease; }
    .feedback { display: none; padding: 15px 16px; border-radius: 14px; margin: 16px 0; }
    .feedback.visible { display: block; animation: rise .2s ease; }
    .feedback.good { color: #155c41; background: var(--green-soft); }
    .feedback.bad { color: #82383b; background: var(--red-soft); }
    .feedback strong { display: block; margin-bottom: 4px; }
    .feedback p { margin: 0 0 8px; font-size: 14px; }
    .concept { display: inline-flex; gap: 5px; align-items: center; padding: 5px 8px; border-radius: 8px; background: #ffffff9c; font-size: 12px; font-weight: 800; }
    .question-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
    .question-actions .right-actions { display: flex; gap: 9px; }
    .question-actions .btn { min-height: 44px; }
    .summary { text-align: center; padding: clamp(26px, 6vw, 48px); }
    .summary-icon { display: grid; place-items: center; width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 25px; background: var(--green-soft); font-size: 34px; }
    .summary h1 { font-size: clamp(30px, 5vw, 42px); }
    .summary-stats { display: flex; justify-content: center; gap: 12px; margin: 24px 0; flex-wrap: wrap; }
    .summary-stat { min-width: 112px; padding: 13px 16px; background: #f7f9fc; border: 1px solid var(--line); border-radius: 13px; }
    .summary-stat strong { display: block; font-size: 22px; }
    .summary-stat span { color: var(--muted); font-size: 12px; }
    .xp-pop { color: #86600c; font-weight: 850; animation: xp .7s ease both; }
    @keyframes xp { 0% { transform: translateY(5px); opacity: 0; } 25% { transform: translateY(-4px); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
    .locked-view { max-width: 700px; margin: 60px auto; padding: 40px; text-align: center; }
    .locked-view .lock-icon { font-size: 42px; margin-bottom: 12px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: #10213b80; backdrop-filter: blur(4px); }
    .modal { position: relative; width: min(100%, 610px); padding: 30px; background: white; border-radius: 22px; box-shadow: 0 24px 80px #091a3470; animation: rise .2s ease both; }
    .modal-close { position: absolute; top: 16px; right: 17px; border: 0; background: #f1f4f8; border-radius: 50%; width: 36px; height: 36px; font-size: 20px; color: var(--muted); }
    .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin: 20px 0; }
    .plan { border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .plan.recommended { border: 2px solid var(--blue); background: #f7f9ff; }
    .plan strong { display: block; font-size: 16px; }
    .plan .price { font-size: 24px; font-weight: 850; margin: 7px 0; }
    .plan small { color: var(--muted); }
    .benefits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; list-style: none; padding: 0; margin: 18px 0; color: #475a74; font-size: 13px; }
    .benefits li:before { content: "✓"; color: var(--green); font-weight: 900; margin-right: 7px; }
    .modal-note { color: var(--muted); font-size: 12px; margin: 12px 0 0; text-align: center; }
    .footer { text-align: center; color: #8b98aa; font-size: 12px; padding: 28px 10px 6px; }
    .footer strong { color: #64748b; }
    .toast { position: fixed; z-index: 30; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 11px 17px; border-radius: 99px; background: #172c4d; color: white; font-size: 13px; font-weight: 750; box-shadow: 0 9px 25px #10203b38; animation: rise .2s ease; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 800px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-grid { grid-template-columns: 1fr; }
      .dashboard-hero { align-items: flex-start; flex-direction: column; padding: 28px; }
      .hero-cta { width: 100%; }
      .dashboard-hero:after { right: -90px; }
    }
    @media (max-width: 540px) {
      .shell { padding: 0 15px 24px; }
      .topbar { min-height: 66px; }
      .brand { font-size: 19px; }
      .top-actions .pill:first-child { display: none; }
      .onboarding { margin: 18px auto; padding: 23px 19px; }
      .choice-grid { grid-template-columns: 1fr; }
      .dashboard-hero { margin-top: 5px; padding: 23px 21px; }
      .stats-grid { gap: 9px; }
      .stat { padding: 14px; }
      .stat strong { font-size: 23px; }
      .route-card { padding: 19px; }
      .section-heading { display: block; }
      .route-progress { width: auto; margin-top: 14px; }
      .route-progress span { text-align: left; }
      .module { grid-template-columns: 38px 1fr auto; gap: 9px; padding: 10px; }
      .module-symbol { width: 36px; height: 36px; }
      .session-head { flex-wrap: wrap; }
      .session-head .progress-track { order: 3; flex-basis: 100%; max-width: none; }
      .session-card { padding: 21px 17px; }
      .question-actions { align-items: stretch; }
      .question-actions .right-actions { flex: 1; justify-content: flex-end; }
      .question-actions .btn { padding: 10px 12px; }
      .plan-grid, .benefits { grid-template-columns: 1fr; }
      .modal { padding: 25px 20px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    /* Identidad visual: mar de datos nocturno y archipiélago luminoso. */
    :root {
      color-scheme: dark;
      --ink:#f1edff; --muted:#aaa4c1; --blue:#a989ff; --blue-dark:#c2adff; --blue-soft:#261d3c;
      --green:#79efbd; --green-soft:#15352e; --amber:#f2c56f; --amber-soft:#392d1a;
      --red:#ff8baa; --red-soft:#3d1f32; --paper:#15131f; --bg:#0b0a13; --line:#312b43;
      --shadow:0 14px 38px #0008, 0 0 28px #8355d00c; --radius:20px;
    }
    body {
      background:radial-gradient(ellipse at 50% -20%,#241739 0%,#100e1a 44%,#0b0a13 77%);
      color:var(--ink);
    }
    body:before {
      content:""; position:fixed; z-index:-1; inset:0; pointer-events:none; opacity:.3;
      background-image:radial-gradient(#b79aff45 1px,transparent 1.4px),radial-gradient(#8e76c922 1px,transparent 1.4px);
      background-size:46px 46px,73px 73px; background-position:0 0,19px 25px;
      mask-image:linear-gradient(#000,transparent 88%);
    }
    .shell { max-width:1240px;position:relative;z-index:1; }
    .brand { color:var(--ink); }
    .brand-mark { border:1px solid #b99aff66; background:linear-gradient(145deg,#a47aff,#51318f); box-shadow:0 0 23px #9d70ff45; }
    .pill { color:#d3cdea; background:#191624d9; border-color:#383149; }
    .pill.premium { color:#ffda91; background:#332817; border-color:#6c5127; }

    .subtle { color:var(--muted); }

    .btn-primary:hover { color:#100b1b; background:linear-gradient(130deg,#d4c2ff,#ad8afb); box-shadow:0 8px 28px #a57aff60; }

    .btn-plain { color:#b5aec9; }

    }

    .hero-content .eyebrow { color:#c4aaff; }
    .hero-content p { color:#c1b9d1; }

    .route-card,.badges-card { border-color:#362e47; }
    .module { background:#171520; border-color:#332e40; }
    .module-symbol { color:#cfbaff; background:#2b2140; }

    .module.locked .module-symbol { color:#8d879e; background:#24212c; }
    .module-meta,.module-percent { color:#aaa4bc; }
    .badge { color:#f5d58e; background:#302717; border-color:#594623; }

    .data-box svg text { fill:#b9b0cd !important; }

    .data-box svg rect,.data-box svg circle { fill:#b294ff !important; }
    .data-box svg path[stroke-dasharray] { stroke:#e2cfff !important; }

      { id:"bas-01", modulo:0, nivel:"Inicial", tipo:"calidad", enunciado:"El equipo de atención compara los tiempos de espera de dos sucursales. ¿Qué dato conviene revisar antes de calcular el promedio?",

        const dx=((event.clientX-rect.left)/rect.width-.5)*8;
        const dy=((event.clientY-rect.top)/rect.height-.5)*6;
        map.style.setProperty("--dx",`${dx.toFixed(1)}px`);
        map.style.setProperty("--dy",`${dy.toFixed(1)}px`);
      });
      map.addEventListener("pointerleave",()=>{map.style.setProperty("--dx","0px");map.style.setProperty("--dy","0px");});
    }
    function selectIsland(index) { selectedIsland=index; renderHome(); }
    function showProfile() { screen="profile"; render(); }
    function showStats() { screen="stats"; render(); }
    function renderProfile() {
      app.innerHTML=`<section class="session-wrap card view" style="padding:clamp(22px,5vw,38px)"><button class="btn btn-plain" onclick="goHome()">${icon("map")} Volver al mapa</button><div class="eyebrow" style="margin-top:20px">Bitácora de viajero/a</div><h1 style="font-size:36px">${escapeHtml(state.name)}</h1><p class="subtle">${escapeHtml(state.goal)} · Nivel declarado: ${escapeHtml(state.declaredLevel)}</p><div class="guide">${nexusAvatar()}<div class="guide-copy"><div class="guide-name">Capitán Nexus</div><p class="guide-message">${guideMessage()}</p></div></div><div class="user-island"><div class="user-island-icon">${icon("compass","lg")}</div><div><strong>Isla de ${escapeHtml(state.name)}</strong><small>Nivel ${levelInfo(state.xp).level} · ${state.xp} XP · ${state.streak} días de racha</small></div></div><h2>Insignias</h2><div class="badges">${achievementCatalog.map(([key,title,iconName])=>`<span class="badge ${state.achievements.includes(key)?"":"badge-locked"}">${icon(iconName,"icon-sm")} ${escapeHtml(title)}</span>`).join("")}</div></section>`;
    }
    function renderStats() {
      const precision=state.correctAnswers+state.incorrectAnswers?Math.round(state.correctAnswers/(state.correctAnswers+state.incorrectAnswers)*100):0;
      const completed=state.completedChallenges.length;
      app.innerHTML=`<section class="session-wrap card view" style="padding:clamp(22px,5vw,38px)"><button class="btn btn-plain" onclick="goHome()">${icon("map")} Volver al mapa</button><div class="eyebrow" style="margin-top:20px">Lectura de tu recorrido</div><h1 style="font-size:36px">Estadísticas</h1><p class="subtle">Una mirada simple a lo que has practicado en este dispositivo.</p><div class="summary-stats"><div class="summary-stat"><strong>${completed}/${challenges.length}</strong><span>Desafíos explorados</span></div><div class="summary-stat"><strong>${precision}%</strong><span>Precisión</span></div><div class="summary-stat"><strong>${state.correctAnswers}</strong><span>Respuestas acertadas</span></div><div class="summary-stat"><strong>${state.streak}</strong><span>Días de racha</span></div></div><div class="module-list">${islandInfo.map((item,index)=>`<article class="module"><div class="module-symbol">${icon(item.icon)}</div><div><div class="module-title">${item.title}</div><div class="module-meta">${Math.round(moduleProgress(index)*100)}% · ${Math.round(moduleProgress(index)*moduleChallengeCount(index))}/${moduleChallengeCount(index)} desafíos</div></div><span class="module-percent">${Math.round(moduleProgress(index)*100)}%</span></article>`).join("")}</div></section>`;
    }
    function eligibleChallenges() {
      return challenges.filter(item => moduleStatus(item.modulo)==="unlocked");
    }
    function pickSessionChallenges(moduleIndex) {
      const available = eligibleChallenges();
      const pending = available.filter(item => !state.completedChallenges.includes(item.id));
      let pool = pending.length >= 5 ? pending : available;
      if (Number.isInteger(moduleIndex)) {
        const preferred=pool.filter(item=>item.modulo===moduleIndex);
        const others=pool.filter(item=>item.modulo!==moduleIndex);
        pool=[...preferred,...others];
      }
      const preferredCount=Number.isInteger(moduleIndex)?Math.min(3,pool.filter(item=>item.modulo===moduleIndex).length):0;
      const selected = [];
      const remaining = pool.slice();
      while (selected.length < 5 && remaining.length) {
        const prior = selected.length ? selected[selected.length-1].tipo : "";
        let choices = remaining.filter(item => item.tipo !== prior);
        if (Number.isInteger(moduleIndex) && selected.filter(item=>item.modulo===moduleIndex).length<preferredCount) {
          const preferred=choices.filter(item=>item.modulo===moduleIndex);
          if(preferred.length) choices=preferred;
        }
        if (!choices.length) choices = remaining;
        const pick = choices[Math.floor(Math.random()*choices.length)];
        selected.push(pick); remaining.splice(remaining.indexOf(pick),1);
      }
      return selected;
    }

    // LÓGICA DE JUEGO: selección, respuesta, pistas y cierre de cada práctica.
    function startSession(moduleIndex) {
      refreshDailyState();
      if(Number.isInteger(moduleIndex)&&moduleStatus(moduleIndex)==="locked") { selectedIsland=moduleIndex;screen="home";render();return; }
      if (dailyLimitReached()) { screen="locked"; render(); return; }
      session = { challenges:pickSessionChallenges(moduleIndex), index:0, correct:0, earned:0, answers:[], retry:false, startedAt:Date.now(), correctRun:0, targetModule:moduleIndex };
      screen="preparing"; render();
      window.setTimeout(()=>{ if(screen==="preparing"){screen="question";render();} },950);
    }
    function renderPreparing() {
      const name=Number.isInteger(session.targetModule)?islandInfo[session.targetModule].title:"Análisis General de Datos";
      app.innerHTML=`<section class="prep-card card view"><div class="prep-orbit" aria-hidden="true">${icon("compass","lg")}</div><div class="eyebrow">Trazando la ruta</div><h1 style="font-size:36px">Preparando travesía</h1><p class="subtle">Cargando cinco desafíos de ${escapeHtml(name)}…</p><div class="progress-track" style="max-width:240px;margin:24px auto 0"><div class="progress-fill" style="width:78%;animation:prep-fill 1s ease both"></div></div><div class="guide compact" style="text-align:left;margin-top:26px">${nexusAvatar()}<div class="guide-copy"><div class="guide-name">Capitán Nexus</div><p class="guide-message">Marca el rumbo: observa primero, interpreta después.</p></div></div></section>`;
    }
    function renderQuestion() {
      const challenge = session.challenges[session.index];
      if (!challenge) { finishSession(); return; }
      const number = session.index + 1;
      const dataHtml = challenge.datos ? `<div class="data-box"><div class="data-caption">${escapeHtml(challenge.datos.caption)}</div>${challenge.datos.html}</div>` : "";
      app.innerHTML = `<section class="session-wrap view" aria-labelledby="question-title">
        <div class="session-head"><button class="btn btn-plain" onclick="confirmExit()">${icon("close")} Salir</button><div class="progress-track" role="progressbar" aria-label="Progreso de sesión" aria-valuenow="${number-1}" aria-valuemin="0" aria-valuemax="5"><div class="progress-fill" style="width:${(number-1)*20}%"></div></div><span class="pill">${icon("streak","icon-sm")} ${number} de 5 · ${session.correctRun} seguidos</span></div>
        <article class="session-card card">
          <div class="question-meta"><span class="tag">${icon(islandInfo[challenge.modulo].icon,"icon-sm")} ${escapeHtml(modules[challenge.modulo])}</span><span class="tag level">${escapeHtml(challenge.nivel)}</span><span class="pill">${icon("xp","icon-sm")} ${session.earned} XP</span><span class="concept-token" title="${escapeHtml(challenge.concepto_clave)}" aria-label="Concepto: ${escapeHtml(challenge.concepto_clave)}">${icon(challengeIcon(challenge.tipo),"icon-sm")}</span></div>
          <h1 class="question" id="question-title">${escapeHtml(challenge.enunciado)}</h1>
          ${challenge.contexto?`<p class="context">${escapeHtml(challenge.contexto)}</p>`:""}${dataHtml}
          <div class="options" role="group" aria-label="Alternativas de respuesta">${challenge.opciones.map((option,index)=>`<button class="option" id="option-${index}" onclick="selectAnswer(${index})"><span class="option-letter">${String.fromCharCode(65+index)}</span><span>${escapeHtml(option)}</span></button>`).join("")}</div>
          <div class="hint" id="hint" role="status">${icon("hint","question-feedback-icon")} ${escapeHtml(challenge.pista)}</div>
          <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
          <div class="question-actions"><button class="btn btn-plain" id="hintButton" onclick="showHint()">${icon("hint")} Ver pista</button><div class="right-actions"><button class="btn btn-primary" id="answerButton" onclick="checkAnswer()" disabled>Responder</button><button class="btn btn-primary" id="continueButton" onclick="continueSession()" hidden>Continuar ${icon("next")}</button></div></div>
        </article>
      </section>`;
      session.selectedAnswer = null;
    }
    function selectAnswer(index) {
      if (session.selectedAnswer !== null) return;
      session.selectedAnswer = index;
      document.querySelectorAll(".option").forEach((button,i)=>button.classList.toggle("selected",i===index));
      document.getElementById("answerButton").disabled = false;
    }
    function showHint() {
      document.getElementById("hint").classList.add("visible");
      document.getElementById("hintButton").disabled = true;
    }
    // 8. DESAFÍOS Y RETROALIMENTACIÓN: feedback específico e inmediato.
    function checkAnswer() {
      if (session.selectedAnswer === null) return;
      const challenge=session.challenges[session.index], chosen=session.selectedAnswer;
      const correct=chosen===challenge.respuesta_correcta;
      session.answers.push({id:challenge.id,correct,chosen});
      if (correct) { session.correct++; session.earned+=10; state.xp+=10; state.correctAnswers++; session.correctRun++; }
      else { state.incorrectAnswers++; session.correctRun=0; }
      state.completedChallenges=[...new Set([...state.completedChallenges,challenge.id])];
      if (session.correctRun>=5) award("streak5");
      if (correct && challenge.tipo==="outlier") award("outlier");
      if (correct && ["visualización","correlación","interpretación","sesgo","fuga de información"].includes(challenge.tipo)) award("reader");
      saveState();
      renderHeader();
      document.querySelectorAll(".option").forEach((button,index)=>{
        button.disabled=true;
        if(index===challenge.respuesta_correcta) button.classList.add("correct");
        if(index===chosen&&!correct) button.classList.add("incorrect");
      });
      const earnedPill=document.querySelector(".question-meta .pill");
      if(earnedPill) earnedPill.innerHTML=`${icon("xp","icon-sm")} ${session.earned} XP`;
      const feedback=document.getElementById("feedback");
      const explanation=correct?challenge.explicacion_correcta:challenge.explicacion_incorrecta[chosen];
      feedback.className=`feedback visible ${correct?"good":"bad"}`;
      feedback.innerHTML=`<strong>${icon(correct?"correct":"incorrect","question-feedback-icon")} ${correct?"Señal bien leída · +10 XP":"Esta señal pedía otra lectura"}</strong><p>${escapeHtml(explanation)}</p><span class="concept">Concepto clave · ${escapeHtml(challenge.concepto_clave)}</span><div class="guide compact">${nexusAvatar()}<div class="guide-copy"><div class="guide-name">Capitán Nexus</div><p class="guide-message">${correct?"Buena lectura. Conserva ese criterio para la siguiente isla.":"No pasa nada: un buen navegante revisa el rumbo y sigue adelante."}</p></div></div>`;
      document.getElementById("answerButton").hidden=true;
      document.getElementById("hintButton").hidden=true;
      document.getElementById("continueButton").hidden=false;
      const streakPill=document.querySelector(".session-head .pill");
      if(streakPill) { streakPill.innerHTML=`${icon("streak","icon-sm")} ${session.index+1} de 5 · ${session.correctRun} seguidos`;streakPill.classList.toggle("streak-energy",session.correctRun>1); }
      if(correct) { playTone("correct");toast(`+10 XP${session.correctRun>1?` · ${session.correctRun} aciertos seguidos`:""}`); }
      else { const card=document.querySelector(".session-card");card.classList.add("answer-miss");window.setTimeout(()=>card.classList.remove("answer-miss"),420); }
      if(!correct) playTone("incorrect");
    }
    function continueSession() {
      session.index++;
      if(session.index>=session.challenges.length) finishSession();
      else render();
    }
    // 9. GAMIFICACIÓN Y PROGRESIÓN: XP, racha diaria, logros y desbloqueos.
    function finishSession() {
      const date=today();
      if(session.correct===5) { session.earned+=5; state.xp+=5; award("perfect");playTone("complete"); }
      if(!state.achievements.includes("first")) award("first");
      if(state.lastSessionDate===date) { /* La racha no aumenta dos veces el mismo día. */ }
      else {
        const previous=new Date(`${state.lastSessionDate}T12:00:00`);
        const current=new Date(`${date}T12:00:00`);
        const gap=state.lastSessionDate?Math.round((current-previous)/86400000):0;
        state.streak=gap===1?state.streak+1:1;
        state.lastSessionDate=date;
      }
      if(state.streak>=3) award("days3");
      if(challenges.every(item=>state.completedChallenges.includes(item.id))) award("explorer");
      state.dailyDate=date;
      if(!session.retry) state.sessionsToday=(state.sessionsToday||0)+1;
      if(session.retry) state.retryUsed=true;
      session.earned=session.earned;
      session.precision=Math.round(session.correct/5*100);
      saveState(); screen="summary"; render();
      if(session.challenges.some(item=>item.modulo===session.targetModule)&&Number.isInteger(session.targetModule)&&moduleProgress(session.targetModule)===1) {
        app.querySelector(".summary")?.classList.add("celebrate");
        toast(`${islandInfo[session.targetModule].title} completada · nueva ruta iluminada ✦`);
      }
    }
    function renderSummary() {
      const perfect=session.correct===5;
      const canRetry=session.correct<4 && !session.retry && !state.retryUsed;
      const nextLocked=dailyLimitReached();
      app.innerHTML=`<section class="session-wrap view"><article class="summary card">
        <div class="summary-icon" aria-hidden="true">${icon(perfect?"medal":session.correct>=4?"complete":"compass","lg")}</div>
        <div class="eyebrow">Sesión completada</div><h1>${perfect?"¡Sesión perfecta!":session.correct>=4?"¡Buen criterio en acción!":"Cada práctica te hace más preciso"}</h1>
        <p class="subtle">${perfect?"Leíste cada señal con precisión y respaldaste tus conclusiones.":session.correct>=4?"Tu criterio se afina con cada decisión bien fundamentada.":"Un desvío también enseña a navegar. Revisa la explicación y vuelve a intentarlo."}</p>
        <div class="summary-stats"><div class="summary-stat"><strong>${session.correct}/5</strong><span>Aciertos</span></div><div class="summary-stat"><strong>${session.precision}%</strong><span>Precisión</span></div><div class="summary-stat"><strong class="xp-pop">+${session.earned} XP</strong><span>Experiencia</span></div><div class="summary-stat"><strong>${icon("streak")} ${state.streak}</strong><span>${state.streak===1?"día":"días"} de racha</span></div></div>
        ${perfect?`<p class="badge" style="margin:0 auto 18px;width:max-content">${icon("medal","icon-sm")} Sesión perfecta · +5 XP extra</p>`:""}
        <div class="guide" style="max-width:510px;margin:0 auto 20px;text-align:left">${nexusAvatar()}<div class="guide-copy"><div class="guide-name">Capitán Nexus</div><p class="guide-message">${perfect?"Has despejado la niebla de esta ruta. La siguiente isla ya está más cerca.":session.correct>=4?"Buen trabajo de navegación. La precisión también se construye con cautela.":"Toda travesía deja aprendizaje. Observa dónde cambió el rumbo y vuelve a zarpar."}</p></div></div>
        <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap">
          <button class="btn btn-secondary" onclick="goHome()">${icon("map")} Volver al mapa</button>
          ${canRetry?`<button class="btn btn-primary" onclick="retrySession()">${icon("repeat")} Repetir sesión</button>`:""}
          ${!canRetry&&nextLocked&&!state.premium?`<button class="btn btn-primary" onclick="openPremium()">${icon("premium")} Ver Premium demo</button>`:""}
          ${!nextLocked?`<button class="btn btn-primary" onclick="startSession()">Otra travesía ${icon("next")}</button>`:""}
        </div>
        ${nextLocked&&!state.premium?'<p class="subtle" style="margin:18px 0 0;font-size:13px">Tu próxima travesía se revelará en 24 horas. Vuelve pronto o prueba Premium demo.</p>':""}
      </article></section>`;
    }
    function retrySession() {
      if(session.correct>=4 || session.retry || state.retryUsed) return;
      const retryChallenges=session.challenges;
      session={challenges:retryChallenges,index:0,correct:0,earned:0,answers:[],retry:true,startedAt:Date.now()};
      screen="question"; render();
    }
    function renderLocked() {
      app.innerHTML=`<section class="locked-view card view"><div class="lock-icon">${icon("locked","lg")}</div><div class="eyebrow">Meta diaria cumplida</div><h1 style="font-size:36px">Tu próxima travesía se revelará en 24 horas</h1><p class="subtle">El mar queda en calma hasta mañana. Tu avance y racha están a salvo.</p><div class="guide" style="max-width:480px;margin:20px auto;text-align:left">${nexusAvatar()}<div class="guide-copy"><div class="guide-name">Capitán Nexus</div><p class="guide-message">Descansa la brújula. Mañana el horizonte traerá nuevas señales para interpretar.</p></div></div>
        <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button class="btn btn-secondary" onclick="goHome()">${icon("map")} Volver al mapa</button>${!state.premium?`<button class="btn btn-primary" onclick="openPremium()">${icon("premium")} Conocer Premium demo</button>`:""}</div></section>`;
    }
    function confirmExit() {
      if(confirm("¿Salir de esta sesión? El avance de este intento no contará como sesión completada.")) { session=null; screen="home"; render(); }
    }
    function goHome() { session=null; screen="home"; render(); window.scrollTo(0,0); }
    function toast(message) {
      const old=document.querySelector(".toast"); if(old) old.remove();
      const node=document.createElement("div"); node.className="toast"; node.setAttribute("role","status"); node.textContent=message; document.body.appendChild(node);
      setTimeout(()=>node.remove(),1700);
    }

    // 10. SISTEMA FREEMIUM SIMULADO: no se procesan pagos ni se conectan servicios.
    function openPremium() { modalOpen=true; render(); }
    function renderPremiumModal() {
      overlay.innerHTML=`<div class="modal-backdrop" role="presentation" onclick="backdropClose(event)"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="premiumTitle">
        <button class="modal-close" aria-label="Cerrar" onclick="closePremium()">${icon("close")}</button>
        <div class="eyebrow">${icon("premium","icon-sm")} DataMind Premium</div><h2 id="premiumTitle" style="font-size:28px;margin:6px 0">Más práctica. Más criterio.</h2>
        <p class="subtle">Elige un plan demo: no se realizará ningún cobro.</p>
        <div class="plan-grid"><article class="plan"><strong>Mensual</strong><div class="price">$4.990 <small>/ mes</small></div><small>Flexibilidad mes a mes</small></article>
          <article class="plan recommended"><span class="eyebrow" style="font-size:10px">Mejor valor</span><strong>Anual</strong><div class="price">$39.990 <small>/ año</small></div><small>Equivale a $3.333 al mes</small></article></div>
        <ul class="benefits"><li>Sesiones ilimitadas*</li><li>Rutas personalizadas</li><li>Desafíos avanzados</li><li>Estadísticas detalladas</li><li>Repaso inteligente de errores</li></ul>
        <button class="btn btn-primary" style="width:100%" onclick="activatePremium()">Activar Premium demo</button>
        <p class="modal-note">* En este piloto se habilita una segunda sesión diaria de práctica. Suscripción y beneficios son demostrativos.</p>
      </section></div>`;
    }
    function backdropClose(event) { if(event.target.classList.contains("modal-backdrop")) closePremium(); }
    function closePremium() { modalOpen=false; render(); }
    function activatePremium() {
      state.premium=true; saveState(); modalOpen=false; render(); toast("Premium demo activado ✦");
    }
    render();
  </script>
</body>
</html>
